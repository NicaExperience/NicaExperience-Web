<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuario - NicaExperience</title>
</head>

<body style="font-family: Arial; background-color: #f4f7f8; padding: 40px;">

    <div style="
        max-width: 500px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    ">

        <h1 style="color:#155e75; text-align:center;">
            Crear Usuario
        </h1>

        <form method="POST">

            {% csrf_token %}

            <p>
                <label>Usuario:</label><br>
                <input 
                    type="text" 
                    name="username" 
                    required
                    style="width:100%; padding:10px; box-sizing:border-box;"
                >
            </p>

            <p>
                <label>Correo electrónico:</label><br>
                <input 
                    type="email" 
                    name="email" 
                    required
                    style="width:100%; padding:10px; box-sizing:border-box;"
                >
            </p>

            <p>
                <label>Contraseña:</label><br>
                <input 
                    type="password" 
                    name="password" 
                    required
                    style="width:100%; padding:10px; box-sizing:border-box;"
                >
            </p>

            <button 
                type="submit"
                style="
                    background:#0f766e;
                    color:white;
                    border:none;
                    padding:12px 20px;
                    border-radius:6px;
                    cursor:pointer;
                "
            >
                Crear usuario
            </button>

            <a 
                href="{% url 'lista_usuarios' %}"
                style="margin-left:15px;"
            >
                Cancelar
            </a>

        </form>

    </div>

</body>
</html>
