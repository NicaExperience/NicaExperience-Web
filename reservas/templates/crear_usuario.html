<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Usuario - NicaExperience">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f8;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: #155e75;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .boton {
            margin-top: 25px;
            background: #0f766e;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .volver {
            display: inline-block;
            margin-left: 10px;
            color: #155e75;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>➕ Crear Usuario</h1>

    <form method="POST">

        {% csrf_token %}

        <label>Usuario</label>
        <input type="text" name="username" required>

        <label>Correo electrónico</label>
        <input type="email" name="email" required>

        <label>Contraseña</label>
        <input type="password" name="password" required>

        <button type="submit" class="boton">
            Crear usuario
        </button>

        <a href="{% url 'lista_usuarios' %}" class="volver">
            Cancelar
        </a>

    </form>

</div>

</body>
</html>
