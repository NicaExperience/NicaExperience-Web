<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuario - NicaExperience</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f8;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: #155e75;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .boton {
            margin-top: 20px;
            background: #0f766e;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .volver {
            margin-left: 10px;
            text-decoration: none;
            color: #155e75;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>✏️ Editar Usuario</h1>

    <form method="POST">

        {% csrf_token %}

        <label>Usuario:</label>
        <input type="text" name="username" value="{{ usuario.username }}" required>

        <label>Nombre:</label>
        <input type="text" name="first_name" value="{{ usuario.first_name }}">

        <label>Apellido:</label>
        <input type="text" name="last_name" value="{{ usuario.last_name }}">

        <label>Correo:</label>
        <input type="email" name="email" value="{{ usuario.email }}">

        <button type="submit" class="boton">
            💾 Guardar cambios
        </button>

        <a href="{% url 'lista_usuarios' %}" class="volver">
            Cancelar
        </a>

    </form>

</div>

</body>
</html>
