<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - NicaExperience</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f8;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: #155e75;
            text-align: center;
        }

        .boton {
            display: inline-block;
            background: #0f766e;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #155e75;
            color: white;
        }

        tr:hover {
            background: #f1f5f9;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>👥 Gestión de Usuarios</h1>

    <a href="#" class="boton">➕ Nuevo usuario</a>

    <table>
        <thead>
            <tr>
                <th>Usuario</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Correo</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>

            {% for usuario in usuarios %}

            <tr>
                <td>{{ usuario.username }}</td>
                <td>{{ usuario.first_name }}</td>
                <td>{{ usuario.last_name }}</td>
                <td>{{ usuario.email }}</td>

                <td>
                    <button>✏️ Editar</button>
                    <button>🗑️ Eliminar</button>
                </td>
            </tr>

            {% empty %}

            <tr>
                <td colspan="5">
                    No hay usuarios registrados.
                </td>
            </tr>

            {% endfor %}

        </tbody>
    </table>

</div>

</body>
</html>
