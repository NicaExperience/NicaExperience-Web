<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Reserva - NicaExperience</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f8;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        h1 {
            color: #155e75;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .boton {
            margin-top: 25px;
            background: #0f766e;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .volver {
            display: inline-block;
            margin-left: 10px;
            color: #155e75;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>✏️ Editar Reserva</h1>

    <form method="POST">

        {% csrf_token %}

        <label>Nombre:</label>
        <input type="text" name="nombre" value="{{ reserva.nombre }}" required>

        <label>Correo:</label>
        <input type="email" name="correo" value="{{ reserva.correo }}" required>

        <label>Fecha:</label>
        <input type="date" name="fecha" value="{{ reserva.fecha|date:'Y-m-d' }}" required>

        <label>Personas:</label>
        <input type="number" name="personas" value="{{ reserva.personas }}" min="1" required>

        <label>Lugar:</label>
        <input type="text" name="lugar" value="{{ reserva.lugar }}">

        <label>Estado:</label>
        <select name="estado">
            <option value="Pendiente" {% if reserva.estado == "Pendiente" %}selected{% endif %}>
                Pendiente
            </option>

            <option value="Confirmada" {% if reserva.estado == "Confirmada" %}selected{% endif %}>
                Confirmada
            </option>

            <option value="Cancelada" {% if reserva.estado == "Cancelada" %}selected{% endif %}>
                Cancelada
            </option>

            <option value="Finalizada" {% if reserva.estado == "Finalizada" %}selected{% endif %}>
                Finalizada
            </option>
        </select>

        <label>Mensaje:</label>
        <textarea name="mensaje">{{ reserva.mensaje }}</textarea>

        <button type="submit" class="boton">
            💾 Guardar cambios
        </button>

        <a href="{% url 'lista_reservas' %}" class="volver">
            Cancelar
        </a>

    </form>

</div>

</body>
</html>
